[project]
name = "mcp-trading-simulator"
version = "0.1.0"
description = "MCP tools, simulated portfolios, research agents and a monitoring dashboard"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12,<2", "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "requests>=2.32,<3"
]
[project.optional-dependencies]
agents = ["openai-agents>=0.15,<1"]
live-market = ["massive>=2,<3"]
gradio = ["gradio>=6,<7", "pandas>=2,<4", "plotly>=6,<7"]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
